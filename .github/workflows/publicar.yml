name: Publicar ObraTop
# Publica no Firebase Hosting (obratop-v3-teste) sempre que um ZIP novo entra na pasta entregas/.
on:
  push:
    branches: [main]
    paths: ['entregas/*.zip']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-obratop
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar pacote
        run: |
          f=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'entregas/*.zip' 2>/dev/null | tail -1)
          [ -n "$f" ] || f=$(ls -t entregas/*.zip | head -1)
          echo "ZIP: $f"
          rm -rf /tmp/p && mkdir /tmp/p && unzip -q "$f" -d /tmp/p
          d=$(dirname "$(find /tmp/p -name firebase.json | head -1)")
          test -f "$d/public/index.html" || { echo "ZIP sem public/index.html"; exit 1; }
          node --check "$d/public/app.js"
          curl -fsSL --max-time 90 -o "$d/public/vendor/xlsx.full.min.js" https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js
          test "$(stat -c %s "$d/public/vendor/xlsx.full.min.js")" -gt 900000
          echo "PKG_DIR=$d" >> "$GITHUB_ENV"
          head -c 200 "$d/public/RELEASE.txt"; echo
      - name: Publicar no Firebase Hosting
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          cd "$PKG_DIR"
          npx -y firebase-tools@13 deploy --only hosting --project obratop-v3-teste --non-interactive
          rm -f /tmp/sa.json
      - name: Conferir o site
        run: |
          sleep 15
          curl -fsS "https://obratop-v3-teste.web.app/RELEASE.txt?c=$GITHUB_RUN_ID" | head -c 200; echo
