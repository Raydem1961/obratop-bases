name: Atualizar bases oficiais ObraTop

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: update-official-cost-bases
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Consultar, baixar, validar e normalizar bases
        run: python scripts/update_bases.py
      - name: Validar catálogo
        run: python scripts/validate_catalog.py
      - name: Publicar somente mudanças válidas
        run: |
          git config user.name "ObraTop Bases Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "chore: atualizar bases oficiais $(date -u +%F)"
            git push
          fi
